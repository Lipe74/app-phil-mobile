<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115">
<title>Mon garage GTA Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--txt:#e8ebf1;--mut:#8f98a8;
  --acc:#f5a623;--ok:#2ecc71;--okbg:#10301f;--bad:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 12px calc(8px) 12px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.3px}
h1 span{color:var(--acc)}
.total{font-size:13px;color:var(--mut)}
.total b{color:var(--ok);font-size:15px}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .3s}
.tabs,.subs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.subs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--mut);margin-left:4px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a1200;font-weight:600}
.chip.on small{color:#4a3500}
.subs .chip{padding:5px 10px;font-size:12px}
.subs .chip.on{background:var(--card2);border-color:var(--acc);color:var(--acc)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 180px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
.search input:focus{border-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);color:var(--mut);border:0;padding:9px 11px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--txt);font-weight:600}
main{padding:12px;max-width:1400px;margin:0 auto}
.count{color:var(--mut);font-size:13px;margin:2px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:auto 360px;transition:border-color .2s}
.card.own{border-color:var(--ok);background:linear-gradient(180deg,var(--okbg),var(--card) 40%)}
.pic{position:relative;aspect-ratio:16/8;background:#0b0d11;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:contain}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:var(--txt);font-size:11px;padding:3px 8px;border-radius:99px}
.own .pic::after{content:"✓ DANS MON GARAGE";position:absolute;top:8px;right:8px;background:var(--ok);color:#06210f;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.4px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.nm{font-size:16px;font-weight:700;line-height:1.2}
.br{font-size:12px;color:var(--mut)}
.info{display:flex;flex-wrap:wrap;gap:5px}
.info span{background:var(--card2);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--txt)}
.line{font-size:12.5px;line-height:1.35;color:#c7cdd8}
.line b{color:var(--acc);font-weight:600}
.line.na{color:var(--mut)}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.foot a{color:var(--mut);font-size:12px;text-decoration:underline}
.tg{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;user-select:none;font-size:14px;font-weight:600}
.tg input{width:20px;height:20px;accent-color:var(--ok);margin:0;cursor:pointer}
.own .tg{background:var(--ok);border-color:var(--ok);color:#06210f}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px 0 40px}
.acts button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer}
.acts button.danger{color:var(--bad)}
#top{position:fixed;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:#1a1200;font-size:20px;font-weight:700;cursor:pointer;display:none;z-index:30}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px;display:none;z-index:40}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🚗 Mon garage <span>GTA Online</span></h1>
    <div class="total"><b id="tOwn">0</b> / <span id="tAll">0</span> véhicules</div>
  </div>
  <div class="bar"><i id="tBar"></i></div>
  <div class="tabs" id="tabs"></div>
  <div class="subs" id="subs"></div>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="Rechercher (nom, marque…)" autocomplete="off"></div>
    <div class="seg" id="seg">
      <button data-f="all" class="on">Tous</button>
      <button data-f="own">Je l'ai</button>
      <button data-f="miss">Manquants</button>
    </div>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Aucun véhicule trouvé.</div>
  <div class="acts">
    <button id="bExp">⬇ Exporter ma progression</button>
    <button id="bImp">⬆ Importer</button>
    <button id="bRst" class="danger">Tout décocher</button>
    <input id="fImp" type="file" accept="application/json,.json" style="display:none">
  </div>
</main>
<button id="top" aria-label="Haut de page">↑</button>
<div id="toast"></div>
<script src="data.js"></script>
<script>
(function(){
'use strict';
var DATA = window.GTA_DATA || [];
var KEY = 'gta_garage_v1';

// Catégories principales + sous-classes (libellés FR)
var CLASS_FR = {
  SUPER:'Super', SPORT:'Sportives', SPORT_CLASSIC:'Sportives classiques', MUSCLE:'Muscle cars',
  OFF_ROAD:'Tout-terrain', SUV:'SUV', SEDAN:'Berlines', COUPE:'Coupés', COMPACT:'Compactes',
  VAN:'Fourgons', UTILITY:'Utilitaires', COMMERCIAL:'Commerciaux', EMERGENCY:'Urgences',
  MILITARY:'Militaires', SERVICE:'Services', INDUSTRIAL:'Industriels', OPEN_WHEEL:'Monoplaces',
  MOTORCYCLE:'Motos', CYCLE:'Vélos', HELICOPTER:'Hélicoptères', PLANE:'Avions', BOAT:'Bateaux'
};
var TOPS = [
  {id:'cars',  label:'🚗 Voitures',   cls:['SUPER','SPORT','SPORT_CLASSIC','MUSCLE','OFF_ROAD','SUV','SEDAN','COUPE','COMPACT','VAN','UTILITY','COMMERCIAL','EMERGENCY','MILITARY','SERVICE','INDUSTRIAL','OPEN_WHEEL']},
  {id:'bikes', label:'🏍️ Motos',      cls:['MOTORCYCLE']},
  {id:'cycles',label:'🚲 Vélos',       cls:['CYCLE']},
  {id:'heli',  label:'🚁 Hélicos',     cls:['HELICOPTER']},
  {id:'planes',label:'✈️ Avions',      cls:['PLANE']},
  {id:'boats', label:'⛵ Bateaux',     cls:['BOAT']}
];

// État
var owned = {};
try { owned = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { owned = {}; }
var st = { top:'cars', sub:'', f:'all', q:'' };

function save(){ try { localStorage.setItem(KEY, JSON.stringify(owned)); } catch(e) {} }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){ t.style.display='none'; },2200); }

// Index
var topOf = {};
TOPS.forEach(function(t){ t.cls.forEach(function(c){ topOf[c]=t.id; }); });
DATA.forEach(function(v){ v._top = topOf[v.c] || 'cars'; v._s = norm(v.nm+' '+(v.b||'')+' '+(CLASS_FR[v.c]||'')); });

function inTop(topId){ return DATA.filter(function(v){ return v._top===topId; }); }
function ownCount(list){ var n=0; list.forEach(function(v){ if(owned[v.n]) n++; }); return n; }

function renderTabs(){
  var h='';
  TOPS.forEach(function(t){
    var l=inTop(t.id); if(!l.length) return;
    h+='<button class="chip'+(st.top===t.id?' on':'')+'" data-top="'+t.id+'">'+t.label+'<small>'+ownCount(l)+'/'+l.length+'</small></button>';
  });
  $('tabs').innerHTML=h;
  var top=TOPS.filter(function(t){return t.id===st.top;})[0];
  var subs='';
  if(top && top.cls.length>1){
    var l=inTop(top.id);
    subs+='<button class="chip'+(st.sub===''?' on':'')+'" data-sub="">Toutes</button>';
    top.cls.forEach(function(c){
      var li=l.filter(function(v){return v.c===c;}); if(!li.length) return;
      subs+='<button class="chip'+(st.sub===c?' on':'')+'" data-sub="'+c+'">'+CLASS_FR[c]+'<small>'+ownCount(li)+'/'+li.length+'</small></button>';
    });
  }
  $('subs').innerHTML=subs;
  $('subs').style.display=subs?'flex':'none';
}

function renderTotals(){
  var n=ownCount(DATA);
  $('tOwn').textContent=n; $('tAll').textContent=DATA.length;
  $('tBar').style.width=(DATA.length?(n*100/DATA.length):0)+'%';
}

function card(v){
  var own=!!owned[v.n];
  var info='';
  if(v.vmax) info+='<span>⚡ '+v.vmax+' km/h</span>';
  if(v.pl) info+='<span>💺 '+v.pl+' pl.</span>';
  if(v.prix) info+='<span>💰 '+esc(v.prix)+'</span>';
  var acq = v.acq ? '<div class="line"><b>🛒 Où l\'obtenir :</b> '+esc(v.acq)+'</div>' : '';
  var lieu = v.lieu ? '<div class="line"><b>📍 Où le trouver / voler :</b> '+esc(v.lieu)+'</div>' : '';
  if(!acq && !lieu) acq='<div class="line na">Infos d\'obtention non disponibles — voir le lien ci-dessous.</div>';
  var link = v.slug
    ? '<a href="https://www.gtabase.com/grand-theft-auto-v/vehicles/'+encodeURIComponent(v.slug)+'" target="_blank" rel="noopener">Fiche complète ↗</a>'
    : '<a href="https://www.google.com/search?q='+encodeURIComponent('GTA Online '+(v.b?v.b+' ':'')+v.nm+' où acheter ou trouver')+'" target="_blank" rel="noopener">Chercher ↗</a>';
  return '<div class="card'+(own?' own':'')+'" data-id="'+esc(v.n)+'">'+
    '<div class="pic"><img loading="lazy" decoding="async" alt="'+esc(v.nm)+'" src="img/'+encodeURIComponent(v.n)+'.webp" onerror="this.style.opacity=.2"><span class="badge">'+esc(CLASS_FR[v.c]||v.c)+'</span></div>'+
    '<div class="body">'+
      '<div><div class="nm">'+esc(v.nm)+'</div>'+(v.b?'<div class="br">'+esc(v.b)+'</div>':'')+'</div>'+
      (info?'<div class="info">'+info+'</div>':'')+acq+lieu+
      '<div class="foot">'+link+'<label class="tg"><input type="checkbox"'+(own?' checked':'')+'> Je l\'ai</label></div>'+
    '</div></div>';
}

function filtered(){
  var q=norm(st.q.trim());
  return DATA.filter(function(v){
    if(v._top!==st.top) return false;
    if(st.sub && v.c!==st.sub) return false;
    var o=!!owned[v.n];
    if(st.f==='own' && !o) return false;
    if(st.f==='miss' && o) return false;
    if(q && v._s.indexOf(q)<0) return false;
    return true;
  });
}

function renderList(){
  var l=filtered();
  $('grid').innerHTML=l.map(card).join('');
  $('empty').style.display=l.length?'none':'block';
  var all=DATA.filter(function(v){return v._top===st.top && (!st.sub||v.c===st.sub);});
  $('count').textContent=l.length+' affiché'+(l.length>1?'s':'')+' · '+ownCount(all)+' / '+all.length+' dans cette catégorie';
}

function renderAll(){ renderTabs(); renderTotals(); renderList(); }

// Événements
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-top]'); if(!b) return;
  st.top=b.getAttribute('data-top'); st.sub=''; st.q=''; $('q').value=''; renderAll(); window.scrollTo(0,0);
});
$('subs').addEventListener('click',function(e){
  var b=e.target.closest('[data-sub]'); if(!b) return;
  st.sub=b.getAttribute('data-sub'); renderTabs(); renderList();
});
$('seg').addEventListener('click',function(e){
  var b=e.target.closest('[data-f]'); if(!b) return;
  st.f=b.getAttribute('data-f');
  Array.prototype.forEach.call($('seg').children,function(x){ x.classList.toggle('on',x===b); });
  renderList();
});
var qt;
$('q').addEventListener('input',function(){
  clearTimeout(qt); var v=this.value; qt=setTimeout(function(){ st.q=v; renderList(); },120);
});
$('grid').addEventListener('change',function(e){
  var c=e.target.closest('.card'); if(!c || e.target.type!=='checkbox') return;
  var id=c.getAttribute('data-id');
  if(e.target.checked) owned[id]=1; else delete owned[id];
  save();
  c.classList.toggle('own',e.target.checked);
  renderTabs(); renderTotals();
  var all=DATA.filter(function(v){return v._top===st.top && (!st.sub||v.c===st.sub);});
  $('count').textContent=$('count').textContent.replace(/·.*$/,'· '+ownCount(all)+' / '+all.length+' dans cette catégorie');
  if(st.f!=='all'){ setTimeout(renderList,250); }
});

$('bExp').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify({v:1,owned:Object.keys(owned)})],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gta-garage.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast('Progression exportée');
});
$('bImp').addEventListener('click',function(){ $('fImp').click(); });
$('fImp').addEventListener('change',function(){
  var f=this.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result), list=j.owned||[], ids={};
      DATA.forEach(function(v){ ids[v.n]=1; });
      owned={}; list.forEach(function(id){ if(ids[id]) owned[id]=1; });
      save(); renderAll(); toast('Progression importée');
    }catch(e){ toast('Fichier invalide'); }
  };
  r.readAsText(f); this.value='';
});
$('bRst').addEventListener('click',function(){
  if(!ownCount(DATA)){ toast('Rien à décocher'); return; }
  if(confirm('Tout décocher ? Pense à exporter avant si besoin.')){ owned={}; save(); renderAll(); }
});

var topBtn=$('top');
window.addEventListener('scroll',function(){ topBtn.style.display=window.scrollY>600?'block':'none'; },{passive:true});
topBtn.addEventListener('click',function(){ window.scrollTo({top:0,behavior:'smooth'}); });

renderAll();
})();
</script>
</body>
</html>
